<!DOCTYPE html>
<html lang="sr">

<head>
  <title>Карта</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="slike/icon.ico">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin="" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
  <link rel="stylesheet" type="text/css"
    href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">
  <link rel="stylesheet" type="text/css" href="css/jquery-comments.css">
  <link rel="stylesheet" href="css/custom.css?v=7">
  <link rel="stylesheet" href="leaflet-sidebar-master/src/L.Control.Sidebar.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
    integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
    crossorigin="anonymous"></script> <!-- mora posle jquery-->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
    integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
    crossorigin=""></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script> <!--leaflet draw-->
  <script src="leaflet-sidebar-master/src/L.Control.Sidebar.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/sr.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

</head>

<body>
  <div id="sidebar">
  </div>
  <div id="radna">
    <div id="izbor_karte" class="izbor_karte">
      <i class="mx-2" title="промјена карте" data-toggle="tooltip" data-placement="bottom" id="promjena_karte"
        style="cursor: pointer; font-style: normal;">сателит</i>
    </div>
    <button type="button" id="mobile-menu-toggle" class="mobile-menu-toggle" aria-label="Мени" aria-expanded="false">
      <i class="bi bi-list"></i>
    </button>
    <div id="navodi" class="navodi">
      <span class="nav-item izbor" id="urednik_tab_icon" style="display: none;" title="уредник"
        data-toggle="tooltip" data-placement="bottom" title2="urednik">
        <i class="bi bi-menu-app-fill mx-2"></i><span class="nav-label">Уредник</span>
      </span>
      <span class="nav-item izbor" title="теме" data-toggle="tooltip" data-placement="bottom" title2="teme">
        <i class="bi-layers mx-2"></i><span class="nav-label">Теме</span>
      </span>
      <span class="nav-item izbor" title="мишљења" data-toggle="tooltip" data-placement="bottom" title2="misljenja">
        <i class="bi-chat-dots mx-2"></i><span class="nav-label">Мишљења</span>
      </span>
      <span class="nav-item izbor" title="догађаји" data-toggle="tooltip" data-placement="bottom" title2="dogadjaji">
        <i class="bi-calendar3 mx-2"></i><span class="nav-label">Догађаји</span>
      </span>
      <span class="nav-item izbor" title="записи" data-toggle="tooltip" data-placement="bottom" title2="zapisi">
        <i class="bi-folder mx-2"></i><span class="nav-label">Записи</span>
      </span>
      <span class="nav-item izbor" title="опште" data-toggle="tooltip" data-placement="bottom" title2="opste">
        <i class="bi-lightbulb mx-2"></i><span class="nav-label">Опште</span>
      </span>
      <span class="nav-item izbor" title="корисник" data-toggle="tooltip" data-placement="bottom" title2="korisnik">
        <i class="bi-person mx-2"></i><span class="nav-label">Корисник</span>
      </span>
      <span class="nav-item izbor" title="подршка" data-toggle="tooltip" data-placement="bottom" title2="podrska">
        <i class="bi bi-cash-coin mx-2"></i><span class="nav-label">Подршка</span>
      </span>
      <span class="nav-item izbor" title="контакт" data-toggle="tooltip" data-placement="bottom" title2="kontakt">
        <i class="bi-envelope mx-2"></i><span class="nav-label">Контакт</span>
      </span>
      <span class="nav-item izbor" title="упутство" data-toggle="tooltip" data-placement="bottom" title2="uputstvo">
        <i class="bi-question-circle mx-2"></i><span class="nav-label">Упутство</span>
      </span>
      <span class="nav-item" id="logout-link" title="излаз" data-toggle="tooltip" data-placement="bottom"
        style="cursor: pointer;">
        <i class="bi-box-arrow-right mx-2"></i><span class="nav-label">Излаз</span>
      </span>
    </div>
    <!-- Dogadjaj detail layer - top positioned -->
    <div id="dogadjaj_layer" class="dogadjaj_layer">
      <div class="dogadjaj_header">
        <i class="bi bi-x" id="dogadjaj_close" style="cursor: pointer; float: right;"></i>
      </div>
      <div class="dogadjaj_content">
        <p id="dogadjaj_opis"></p>
        <p id="dogadjaj_vrijeme"></p>
        <p id="dogadjaj_izvor"></p>
        <p id="dogadjaj_zapis" style="display: none;"></p>
      </div>
      <div class="dogadjaj_resize_handle"></div>
    </div>
    <!-- Playback info layer - bottom positioned -->
    <div id="playback_info_layer" class="dogadjaj_layer"
      style="top: auto; bottom: 0; height: auto; display: none; z-index: 2000;">
      <div class="dogadjaj_header">
        <i class="bi bi-x" id="playback_close" style="cursor: pointer; float: right;"></i>
      </div>
      <div class="dogadjaj_content"
        style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px; padding: 10px;">
        <p id="playback_time_window" style="font-weight: bold; margin: 0;">-</p>
        <div id="playback_controls" style="font-size: 1.5rem; display: flex; gap: 10px;">
          <i class="bi bi-pause-btn-fill" id="playback_pause_btn" style="cursor: pointer; color: #6c757d;"
            title="заустави"></i>
          <i class="bi bi-stop-btn-fill" id="playback_stop_btn" style="cursor: pointer; color: #6c757d;"
            title="прекини"></i>
        </div>
      </div>
    </div>
    <div id="kartaid" style="width: 100%;"></div>
    <!-- Dynamic content container for navigation sections -->
    <div id="section-content" class="sloj_vidi"></div>
    <button type="button" id="mobile-panel-close" class="mobile-panel-close" aria-label="Затвори панел">
      <i class="bi bi-x-lg"></i> Затвори
    </button>
  </div>

  <script src="js/config/theme_config.js"></script>
  <script src="js/config/draw_config.js"></script>
  <script type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery.textcomplete/1.8.0/jquery.textcomplete.js"></script>
  <script src="js/jquery-comments.js"></script>
  <script src="karta.js?v=2"></script>
</body>

</html>
