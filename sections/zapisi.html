<style>
    #zapisi_results {
        margin-top: 12px;
    }

    .zapis-item {
        padding: 8px 6px;
        border-bottom: 1px solid #e9ecef;
        transition: background-color 0.15s ease;
    }

    .zapis-item,
    .zapis-item-header,
    .zapis-item-opis {
        text-align: left;
    }

    .zapis-item:hover {
        background-color: rgba(0, 0, 0, 0.04);
    }

    .zapis-item-header {
        display: flex;
        align-items: baseline;
        gap: 6px;
        line-height: 1.5;
    }

    .zapis-id-badge {
        display: inline-block;
        flex-shrink: 0;
        font-size: 0.78rem;
        font-weight: 600;
        color: #555;
        background-color: #f1f3f5;
        border: 1px solid #dee2e6;
        border-radius: 3px;
        padding: 0 5px;
        line-height: 1.4;
    }

    .zapis-item-opis {
        margin-top: 3px;
        font-size: 0.95rem;
        color: #000;
        line-height: 1.5;
        word-break: break-word;
    }

    /* Custom file input styling */
    #zapisi_unos_form .custom-file-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        padding-right: 130px;
    }

    #zapisi_unos_form .custom-file-label::after {
        content: "изабери запис" !important;
    }

    #zapisi_unos_form .custom-file-input:lang(sr)~.custom-file-label::after {
        content: "изабери запис" !important;
    }

    .zapis-link {
        color: #c96a00;
        font-weight: 400;
        font-size: 1rem;
        text-decoration: none;
        word-break: break-word;
    }

    .zapis-link:hover {
        text-decoration: underline;
        color: #a85500;
    }
</style>

<div class="sekcija-fiksni-vrh">
    <span class="sekcija-fiksni-deo" style="display: block">
        <span class="naslov">Записи</span>
    </span>

    <div id="zapisi_accordion" class="sekcija-accordion-flex">
        <!-- Унос Section -->
        <div id="zapisi_unos" class="mt-2 sekcija-fiksni-deo"><strong>унос</strong> <span class="bi bi-arrows-expand ml-2"
                data-toggle="collapse" data-target="#zapisi_unos_sadrzaj"></span>
        </div>
        <div id="zapisi_unos_sadrzaj" class="collapse sekcija-fiksni-deo-ogranicen">
        <div style="margin-top: 10px;">
            <form id="zapisi_unos_form" enctype="multipart/form-data" novalidate>
                <!-- Hidden field for username -->
                <input type="hidden" id="unos_korisnik" name="korisnik">

                <div class="form-row">
                    <div class="col">
                        <input type="text" class="form-control" id="unos_naziv" name="naziv"
                            placeholder="назив * (макс. 255 карактера)" maxlength="255">
                        <small id="unos_naziv_counter" class="form-text text-muted text-right"
                            style="margin-top: 2px; font-size: 0.78rem;">0 / 255</small>
                    </div>
                    <div class="col">
                        <select id="unos_tema" name="tema_id" class="form-control">
                            <option value="">-- изаберите тему --</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="col">
                        <textarea class="form-control" id="unos_opis" name="opis"
                            placeholder="опис * (макс. 500 карактера)" rows="3" maxlength="500"
                            style="resize: both;"></textarea>
                        <small id="unos_opis_counter" class="form-text text-muted text-right"
                            style="margin-top: 2px; font-size: 0.78rem;">0 / 500</small>
                    </div>
                </div>

                <div class="form-row">
                    <div class="col">
                        <input type="text" class="form-control" id="unos_tagovi" name="tagovi"
                            placeholder="тагови * (одвојени зарезом, макс. 255 карактера)" maxlength="255">
                        <small id="unos_tagovi_counter" class="form-text text-muted text-right"
                            style="margin-top: 2px; font-size: 0.78rem;">0 / 255</small>
                    </div>
                </div>

                <div class="form-row mt-1">
                    <div class="col">
                        <div class="custom-file">
                            <input type="file" class="custom-file-input" id="unos_file" name="file"
                                accept=".pdf,.jpg,.jpeg,.png">
                            <label class="custom-file-label" for="unos_file">запис није изабран</label>
                        </div>
                    </div>
                </div>

                <div class="form-row mt-2">
                    <div class="col">
                        <div id="unos_error" style="color: orange; display: none;"></div>
                    </div>
                    <button type="submit" class="btn btn-white border border-dark">додај</button>
                    <div class="spinner-border text-secondary spinner-border-sm m-2" id="unos_cekanje" role="status"
                        style="visibility: hidden;">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Тражи Section -->
    <div id="zapisi_trazi" class="mt-2 sekcija-fiksni-deo"><strong>тражи</strong> <span class="bi bi-arrows-expand ml-2"
            data-toggle="collapse" data-target="#zapisi_trazi_sadrzaj"></span>
    </div>
    <div id="zapisi_trazi_sadrzaj" class="collapse show sekcija-collapse-flex">
        <div class="sekcija-fiksni-deo" style="margin-top: 10px;">
            <form id="zapisi_trazi_form">
                <div class="form-row">
                    <div class="col">
                        <input type="text" class="form-control" id="trazi_naziv" name="naziv" placeholder="назив">
                    </div>
                    <div class="col">
                        <select id="trazi_tema" name="tema" class="form-control">
                            <option value="">-- све теме --</option>
                        </select>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="trazi_korisnik" name="korisnik"
                            placeholder="корисник">
                    </div>
                </div>

                <div class="form-row">
                    <div class="col">
                        <input type="text" class="form-control" id="trazi_opis" name="opis" placeholder="опис">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="trazi_tagovi" name="tagovi" placeholder="тагови">
                    </div>
                </div>

                <div class="form-row mt-2">
                    <div class="col">
                        <div id="trazi_error" style="color: orange; display: none;"></div>
                    </div>
                    <button type="submit" class="btn btn-white border border-dark">тражи</button>
                    <div class="spinner-border text-secondary spinner-border-sm m-2" id="trazi_cekanje" role="status"
                        style="visibility: hidden;">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </form>
        </div>

        <!-- Results List -->
        <div id="zapisi_results" class="sekcija-lista-scroll" style="display: none;">
            <div id="zapisi_results_title" class="text-muted small mb-1 sekcija-lista-naslov-sticky"></div>
            <div id="zapisi_results_body">
                <!-- Results will be populated dynamically -->
            </div>
        </div>
    </div>
</div>
</div>
