<span style="display: block">
    <span class="naslov">Догађаји</span>
</span>

<style>
    #dogadjaji_results table tr:hover {
        background-color: rgba(0, 0, 0, 0.05);
    }

    #dogadjaji_results {
        margin-top: 15px;
    }

    .zapis-autocomplete-wrapper {
        position: relative;
    }

    .zapis-clear-btn {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #6c757d;
        cursor: pointer;
        padding: 0 4px;
        font-size: 1rem;
        line-height: 1;
        display: none;
        z-index: 5;
    }

    .zapis-clear-btn:hover {
        color: #212529;
    }

    .zapis-autocomplete-dropdown {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 1050;
        background: #fff;
        border: 1px solid #ced4da;
        border-top: none;
        border-radius: 0 0 0.25rem 0.25rem;
        max-height: 200px;
        overflow-y: auto;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
        display: none;
    }

    .zapis-autocomplete-item {
        padding: 6px 10px;
        cursor: pointer;
        font-size: 0.9rem;
        border-bottom: 1px solid #f1f1f1;
    }

    .zapis-autocomplete-item:last-child {
        border-bottom: none;
    }

    .zapis-autocomplete-item:hover,
    .zapis-autocomplete-item.active {
        background-color: #f0f4ff;
    }

    .zapis-autocomplete-empty {
        padding: 8px 10px;
        font-size: 0.85rem;
        color: #6c757d;
    }
</style>

<div id="dogadjaji_accordion">
    <!-- Унос Section -->
    <div id="dogadjaji_unos" class="mt-2"><strong>унос</strong> <span class="bi bi-arrows-expand ml-2"
            data-toggle="collapse" data-target="#dogadjaji_unos_sadrzaj"></span>
    </div>
    <div id="dogadjaji_unos_sadrzaj" class="collapse">
        <div style="margin-top: 10px;">
            <form id="dogadjaji_unos_form" novalidate>
                <!-- Hidden field for username -->
                <input type="hidden" id="dogadjaji_unos_korisnik" name="korisnik">

                <div class="form-row">
                    <div class="col">
                        <textarea class="form-control" id="dogadjaji_unos_opis" name="opis"
                            placeholder="опис * (мин. 10 карактера)" rows="3" style="resize: both;"
                            maxlength="255"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="col-6">
                        <input type="text" class="form-control flatpickr-input" id="dogadjaji_unos_pocetak"
                            name="pocetak" placeholder="почетак *">
                    </div>
                    <div class="col-6">
                        <input type="text" class="form-control flatpickr-input" id="dogadjaji_unos_kraj" name="kraj"
                            placeholder="крај">
                    </div>
                </div>

                <div class="form-row">
                    <div class="col">
                        <input type="text" class="form-control" id="dogadjaji_unos_koordinate" name="koordinate"
                            placeholder="координате" readonly>
                    </div>
                    <div class="col-auto">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="dogadjaji_marker_tool"
                                name="marker_tool">
                            <label class="form-check-label" for="dogadjaji_marker_tool">
                                алат
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="col-12">
                        <input type="text" class="form-control" id="dogadjaji_unos_izvor" name="izvor"
                            placeholder="извор *" maxlength="500">
                    </div>
                </div>

                <div class="form-row">
                    <div class="col-12">
                        <div class="zapis-autocomplete-wrapper">
                            <input type="hidden" id="dogadjaji_unos_zapis" name="zapis">
                            <input type="text" class="form-control" id="dogadjaji_unos_zapis_search"
                                placeholder="запис (ID или назив)" autocomplete="off" style="padding-right: 28px;">
                            <button type="button" id="dogadjaji_unos_zapis_clear" class="zapis-clear-btn"
                                title="обриши избор">&times;</button>
                            <div id="dogadjaji_unos_zapis_dropdown" class="zapis-autocomplete-dropdown"></div>
                        </div>
                    </div>
                </div>

                <div class="form-row mt-2">
                    <div class="col">
                        <div id="dogadjaji_unos_error" style="color: orange; display: none;"></div>
                    </div>
                    <button type="submit" class="btn btn-white border border-dark">додај</button>
                    <div class="spinner-border text-secondary spinner-border-sm m-2" id="dogadjaji_unos_cekanje"
                        role="status" style="visibility: hidden;">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Тражи Section -->
    <div id="dogadjaji_trazi" class="mt-2"><strong>тражи</strong> <span class="bi bi-arrows-expand ml-2"
            data-toggle="collapse" data-target="#dogadjaji_trazi_sadrzaj"></span>
    </div>
    <div id="dogadjaji_trazi_sadrzaj" class="collapse show">
        <div style="margin-top: 10px;">
            <form id="dogadjaji_trazi_form">
                <div class="form-row">
                    <div class="col">
                        <input type="text" class="form-control" id="dogadjaji_trazi_opis" name="opis"
                            placeholder="опис">
                    </div>
                </div>

                <div class="form-row">
                    <div class="col-6">
                        <input type="text" class="form-control flatpickr-input" id="dogadjaji_trazi_pocetak"
                            name="pocetak" placeholder="почетак">
                    </div>
                    <div class="col-6">
                        <input type="text" class="form-control flatpickr-input" id="dogadjaji_trazi_kraj" name="kraj"
                            placeholder="крај">
                    </div>
                </div>

                <div class="form-row">
                    <div class="col">
                        <select class="form-control" id="dogadjaji_trazi_izvor" name="izvor">
                            <option value="">извор</option>
                            <option value="1">одређено</option>
                            <option value="0">неодређено</option>
                        </select>
                    </div>
                    <div class="col">
                        <select class="form-control" id="dogadjaji_trazi_prostorno" name="prostorno">
                            <option value="">просторно</option>
                            <option value="1">одређено</option>
                            <option value="0">неодређено</option>
                        </select>
                    </div>
                    <div class="col">
                        <select class="form-control" id="dogadjaji_trazi_vremenski" name="vremenski">
                            <option value="">временски</option>
                            <option value="1">одређено</option>
                            <option value="0">неодређено</option>
                        </select>
                    </div>
                </div>

                <div class="form-row mt-2">
                    <div class="col">
                        <div id="dogadjaji_trazi_error" style="color: orange; display: none;"></div>
                    </div>
                    <button type="submit" class="btn btn-white border border-dark">тражи</button>
                    <div class="spinner-border text-secondary spinner-border-sm m-2" id="dogadjaji_trazi_cekanje"
                        role="status" style="visibility: hidden;">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </form>
        </div>

        <!-- Results Table -->
        <div id="dogadjaji_results" style="display: none;">
            <div id="dogadjaji_results_title" class="text-muted small mb-1"></div>
            <table style="width: 100%; border-collapse: collapse;">
                <tbody id="dogadjaji_results_body">
                    <!-- Results will be populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>
