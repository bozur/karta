<span style="display: block">
    <span class="naslov">Мишљења</span>
</span>

<style>
    #misljenja_results {
        margin-top: 15px;
    }

    .misljenje-item {
        padding: 8px 6px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition: background-color 0.15s ease;
    }

    .misljenje-item:hover {
        background-color: rgba(0, 0, 0, 0.05);
    }

    .misljenje-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px 8px;
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 4px;
    }

    .misljenje-tema {
        color: darkorange;
        font-weight: 600;
    }

    .misljenje-content {
        font-size: 0.9rem;
        line-height: 1.35;
        color: #222;
        word-break: break-word;
    }

    .misljenje-stats {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }

    .misljenje-up {
        color: #2e7d32;
    }

    .misljenje-down {
        color: #c62828;
    }
</style>

<div id="misljenja_accordion">
    <!-- Тражи Section -->
    <div id="misljenja_trazi" class="mt-2"><strong>тражи</strong> <span class="bi bi-arrows-expand ml-2"
            data-toggle="collapse" data-target="#misljenja_trazi_sadrzaj"></span>
    </div>
    <div id="misljenja_trazi_sadrzaj" class="collapse show">
        <div style="margin-top: 10px;">
            <form id="misljenja_trazi_form">
                <div class="form-row">
                    <div class="col-6">
                        <select id="misljenja_trazi_tema" name="tema" class="form-control">
                            <option value="">-- све теме --</option>
                            <option value="dogadjaji">Догађаји</option>
                        </select>
                    </div>
                    <div class="col-6">
                        <select id="misljenja_trazi_sort" name="sort" class="form-control">
                            <option value="newest">најновија прво</option>
                            <option value="oldest">најстарија прво</option>
                            <option value="upvotes">највише одобравања</option>
                            <option value="downvotes">највише неслагања</option>
                            <option value="active">највише реакција</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="col">
                        <input type="text" class="form-control" id="misljenja_trazi_tekst" name="tekst"
                            placeholder="текст мишљења">
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="misljenja_trazi_korisnik" name="korisnik"
                            placeholder="корисник">
                    </div>
                </div>

                <div class="form-row mt-2">
                    <div class="col">
                        <div id="misljenja_trazi_error" style="color: orange; display: none;"></div>
                    </div>
                    <button type="submit" class="btn btn-white border border-dark">тражи</button>
                    <div class="spinner-border text-secondary spinner-border-sm m-2" id="misljenja_trazi_cekanje"
                        role="status" style="visibility: hidden;">
                        <span class="sr-only">Loading...</span>
                    </div>
                </div>
            </form>
        </div>

        <!-- Results List -->
        <div id="misljenja_results" style="display: none;">
            <div id="misljenja_results_title" class="text-muted small mb-1"></div>
            <div id="misljenja_results_list">
                <!-- Results will be populated dynamically -->
            </div>
        </div>
    </div>
</div>
