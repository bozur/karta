<!DOCTYPE html>
<html lang="sr">

<head>
  <title>Карта</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta http-equiv="Content-type" content="text/html;charset=UTF-8">
  <meta name="keywords" content="">
  <meta name="description" content="">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" /> <!--for IE compatibility-->

  <link rel="shortcut icon" href="slike/icon.ico">

  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
    crossorigin="" />

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
    integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
    crossorigin="anonymous"></script>


  <!--<script src="js/index.js"></script> izmijeniti po potrebi-->

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.0/font/bootstrap-icons.css">
  <style>
    body,
    html {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Lato, sans-serif;
      color: #fff;
    }

    #naslovna {
      background-image: url("slike/naslovna.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      width: 100%;
      height: 100%;

    }

    .form-control {
      border-width: 1px;
      border-color: #fff;
      background-color: transparent;
      color: #fff;
    }

    .form-control:focus {
      border-width: 1px;
      border-color: #f5a615;
      background-color: rgba(0, 0, 0, 0.1);
      color: #fff;
      outline: none !important;
      box-shadow: none !important;
    }

    .veza {
      color: #ffffff;
    }

    .veza:hover {
      color: #f5a615;
      text-decoration: none;
    }

    .veza2 {
      color: #dddddd;
    }

    #logform {
      background-color: rgba(0, 0, 0, 0.1);
    }
  </style>

</head>

<body>
  <div class="container-fluid" id="naslovna">

    <div class="row pt-5">
      <div class="col-sm-1 col-xs-auto align-self-start">
      </div>
      <div class="col-sm-10 col-xs-auto align-self-center pt-3 text-center ">
        <h1>Kроз простор и вријеме!</h1>
        <h3>изнад митова и легенди</h3><br><span style="color:gold;">КАРТА.СРБ</span> <img src="slike/icon.png"
          style="vertical-align:bottom"><br> тражи, додај, подијели, прати, откриј, учи, ...<br><br>
        <br>

        <div class="col d-flex justify-content-center">
          <div class="p-2 border border-warning rounded text-justify" style="width:400px; " id="logform">
            <div id="logging0"><a href="#" class="veza">пријава</a></div>
            <div id="logging">
              <form id="change-logging" class="mx-0" method="POST">
                <div class="form-group row m-0">
                  <label for="username" class="col-form-label col-6 veza2" title="">корисник:</label>
                  <input type="text" class="form-control col-6" id="username" name="username">
                </div>
                <div class="form-group row m-0">
                  <label for="password" class="col-form-label col-6 veza2" title="">лозинка:</label>
                  <input type="password" class="form-control col-6" id="password" name="password">
                </div>
                <div class="form-group row m-0">
                  <label for="remember" class="col-form-label col-6 veza2" title="">запамти ме:</label>
                  <input type="checkbox" class="form-control col-1 my-auto ml-0" style="width: 20px; height:20px;"
                    id="remember" name="remember">
                  <label for="loggingenter" class="col-form-label col-2" title=""></label>
                  <input type="submit" class="form-control col-3 mt-1 btn btn-outline-warning" id="loggingenter"
                    value="улаз" title="log-in" name="loggingenter" />
                  <label id="loggingenter0" class="col-form-label col-12 errorTxt" title=""></label>
                </div>
              </form>
            </div>
            <div id="passwordforgotten0"><a href="#" class="veza">заборављена лозинка</a></div>
            <div id="passwordforgotten">
              <form id="change-forgotten" class="mx-0" method="POST">
                <div class="form-group row m-0">
                  <label for="email2" class="col-form-label col-6 veza2" title="">e-пошта:</label>
                  <input type="text" class="form-control col-6" id="email2" name="email2">
                  <label for="passwordforgottenenter" class="col-form-label col-9" title=""></label>
                  <input type="submit" class="form-control col-3 mt-1 btn btn-outline-warning"
                    id="passwordforgottenenter" value="пошаљи" title="унеси ако желиш нову лозинку"
                    name="passwordforgottenenter" />
                  <label id="passwordforgottenenter0" class="col-form-label col-12 errorTxt" title=""></label>
                </div>
              </form>
            </div>
            <div id="newuser0"><a href="#" class="veza">нови корисник</a></div>
            <div id="newuser">
              <form id="change-newuser" class="mx-0" method="POST">
                <div class="form-group row m-0">
                  <label for="asign" class="col-form-label col-6 veza2" title="">e-пошта:</label>
                  <input type="text" class="form-control col-6" id="asign" name="asign">
                  <label for="newuserenter" class="col-form-label col-9" title=""></label>
                  <input type="submit" class="form-control col-3 mt-1 btn btn-outline-warning" id="newuserenter"
                    value="улаз" title="унеси ако си нови корисник" name="newuserenter" />
                  <label id="newuserenter0" class="col-form-label col-12 errorTxt" title=""></label>
                </div>
              </form>
            </div>
          </div>

        </div>

        <div class="col "><small><br>&copy; 2021 сва права задржана</small><input id="bup" value="улаз"
            title="provjera" /></div>
      </div>
      <div class="col-sm-1 col-xs-auto align-self-start">
      </div>
    </div>

  </div>

</body>

</html>
<script>


  $(document).ready(function () {

    $("#bup").click(function () {
      window.location.href = '/karta.html';
    });


    $("#logging").show();
    $("#passwordchange").hide();
    $("#passwordforgotten").hide();
    $("#newuser").hide();


    $("#logging0").click(function () {
      $("#logging").toggle();
      $("#passwordchange").hide();
      $("#passwordforgotten").hide();
      $("#newuser").hide();
    });
    $("#passwordchange0").click(function () {
      $("#logging").hide();
      $("#passwordchange").toggle();
      $("#passwordforgotten").hide();
      $("#newuser").hide();
    });
    $("#passwordforgotten0").click(function () {
      $("#logging").hide();
      $("#passwordchange").hide();
      $("#passwordforgotten").toggle();
      $("#newuser").hide();
    });
    $("#newuser0").click(function () {
      $("#logging").hide();
      $("#passwordchange").hide();
      $("#passwordforgotten").hide();
      $("#newuser").toggle();
    });

  });
</script>
